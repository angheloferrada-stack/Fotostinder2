name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Crear proyecto
        run: |
          flutter create --platforms=android --project-name limpia_galeria app
          cp main.dart app/lib/main.dart
      - name: Paquetes y permisos
        working-directory: app
        run: |
          flutter pub add photo_manager video_player shared_preferences
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>' $M
          sed -i '/<application/i <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>' $M
          sed -i '/<application/i <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' $M
          sed -i '/<application/i <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>' $M
          sed -i '/<application/i <uses-permission android:name="android.permission.ACCESS_MEDIA_LOCATION"/>' $M
      - name: Compilar
        working-directory: app
        run: flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
